name: ssh_mobile
description: Mobile SSH client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  dartssh2: ^2.8.2
  xterm: ^4.0.0
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
  flutter_local_notifications: ^21.0.0
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.19.0
  path: ^1.9.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
