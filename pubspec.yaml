name: ssh_mobile
description: 移动端 SSH 客户端 - 支持后台长连接不中断
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # SSH 连接 - 纯 Dart 实现，跨平台
  dartssh2: ^2.8.2
  
  # 终端模拟 - ANSI 转义码渲染
  xterm: ^4.0.0
  
  # 后台保活 - Android 前台服务
  flutter_background_service: ^5.0.10
  flutter_background_service_android: ^6.2.0
  flutter_background_service_ios: ^5.0.0
  
  # 安全存储 - 密码/私钥加密存储
  flutter_secure_storage: ^9.2.4
  
  # 状态管理
  provider: ^6.1.2
  
  # 本地存储
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  
  # 工具
  uuid: ^4.5.1
  intl: ^0.19.0
  path: ^1.9.1
  
  # 权限
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
