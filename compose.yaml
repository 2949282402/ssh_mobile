services:
  relay:
    build:
      context: ./relay
      dockerfile: Dockerfile.relay
      args:
        RELAY_INTERNAL_PORT: ${RELAY_INTERNAL_PORT:-8080}
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - "${RELAY_INTERNAL_PORT:-8080}"
    environment:
      RELAY_ADDR: ":${RELAY_INTERNAL_PORT:-8080}"
      RELAY_ENROLLMENT_TOKEN: ${RELAY_ENROLLMENT_TOKEN:?set a one-time enrollment token}
      RELAY_CREDENTIAL_KEY: ${RELAY_CREDENTIAL_KEY:?set a base64url 32-byte signing key}
      RELAY_INTERNAL_TOKEN: ${RELAY_INTERNAL_TOKEN:?set a 32-character internal management token}
      RELAY_CREDENTIAL_TTL: ${RELAY_CREDENTIAL_TTL:-24h}
      RELAY_MAX_CONNECTIONS: ${RELAY_MAX_CONNECTIONS:-2048}
      RELAY_MAX_ENROLLED_DEVICES: ${RELAY_MAX_ENROLLED_DEVICES:-4096}
      RELAY_MAX_REVOKED_DEVICES: ${RELAY_MAX_REVOKED_DEVICES:-4096}
      RELAY_MAX_TRANSFER_SESSIONS: ${RELAY_MAX_TRANSFER_SESSIONS:-4096}
      RELAY_MAX_PENDING_FRAMES_PER_DEVICE: ${RELAY_MAX_PENDING_FRAMES_PER_DEVICE:-64}
      RELAY_MAX_PENDING_BYTES_PER_DEVICE: ${RELAY_MAX_PENDING_BYTES_PER_DEVICE:-16777216}
      RELAY_MAX_FRAMES_PER_SECOND_PER_DEVICE: ${RELAY_MAX_FRAMES_PER_SECOND_PER_DEVICE:-256}
      RELAY_MAX_BYTES_PER_SECOND_PER_DEVICE: ${RELAY_MAX_BYTES_PER_SECOND_PER_DEVICE:-67108864}
      RELAY_HTTP_READ_TIMEOUT: ${RELAY_HTTP_READ_TIMEOUT:-15s}
      RELAY_HTTP_WRITE_TIMEOUT: ${RELAY_HTTP_WRITE_TIMEOUT:-15s}
      RELAY_HTTP_IDLE_TIMEOUT: ${RELAY_HTTP_IDLE_TIMEOUT:-60s}
      RELAY_HTTP_MAX_HEADER_BYTES: ${RELAY_HTTP_MAX_HEADER_BYTES:-16384}
      RELAY_TRUSTED_PROXY_CIDRS: ${RELAY_TRUSTED_PROXY_CIDRS:-172.30.0.10/32}
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:?set the externally reachable Relay origin}
      # Storage backend: "mysql" (the Compose default) or "memory" (local development only).
      RELAY_STORAGE_MODE: ${RELAY_STORAGE_MODE:-mysql}
      RELAY_DATABASE_URL: ${RELAY_DATABASE_URL:?set the Relay MySQL DSN}
      RELAY_REDIS_URL: ${RELAY_REDIS_URL:?set the Relay Redis URL}
      RELAY_REDIS_PASSWORD: ${RELAY_REDIS_PASSWORD:?set the Relay Redis password}
      RELAY_INSTANCE_ID: ${RELAY_INSTANCE_ID:-}
      RELAY_PRESENCE_TTL: ${RELAY_PRESENCE_TTL:-60s}
    depends_on:
      mysql:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    networks:
      - relay_internal
      - relay_state

  admin-api:
    build:
      context: ./relay
      dockerfile: Dockerfile.admin
      args:
        ADMIN_INTERNAL_PORT: ${ADMIN_INTERNAL_PORT:-8081}
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      replicas: 1
    depends_on:
      analytics-mysql:
        condition: service_healthy
        required: true
    expose:
      - "${ADMIN_INTERNAL_PORT:-8081}"
    environment:
      ADMIN_ADDR: ":${ADMIN_INTERNAL_PORT:-8081}"
      ADMIN_USER: ${ADMIN_USER:?set administrator username}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set administrator password with at least 12 characters}
      ADMIN_AUTH_KEY: ${ADMIN_AUTH_KEY:?set base64url 32-byte administrator auth key}
      ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-24h}
      ADMIN_MAX_SESSIONS: ${ADMIN_MAX_SESSIONS:-32}
      ADMIN_LOGIN_MAX_ATTEMPTS: ${ADMIN_LOGIN_MAX_ATTEMPTS:-5}
      ADMIN_LOGIN_WINDOW: ${ADMIN_LOGIN_WINDOW:-1m}
      ADMIN_LOGIN_BLOCK: ${ADMIN_LOGIN_BLOCK:-5m}
      ADMIN_MAX_LOGIN_ENTRIES: ${ADMIN_MAX_LOGIN_ENTRIES:-4096}
      ADMIN_HTTP_READ_TIMEOUT: ${ADMIN_HTTP_READ_TIMEOUT:-15s}
      ADMIN_HTTP_WRITE_TIMEOUT: ${ADMIN_HTTP_WRITE_TIMEOUT:-15s}
      ADMIN_HTTP_IDLE_TIMEOUT: ${ADMIN_HTTP_IDLE_TIMEOUT:-60s}
      ADMIN_HTTP_MAX_HEADER_BYTES: ${ADMIN_HTTP_MAX_HEADER_BYTES:-16384}
      ADMIN_TRUSTED_PROXY_CIDRS: ${ADMIN_TRUSTED_PROXY_CIDRS:-}
      ADMIN_RELAY_URL: "http://relay:${RELAY_INTERNAL_PORT:-8080}"
      ADMIN_RELAY_INTERNAL_TOKEN: ${ADMIN_RELAY_INTERNAL_TOKEN:-${RELAY_INTERNAL_TOKEN:?set internal token}}
      # Analytics/telemetry backend: MySQL (durable events) and Redis (diagnostic hot cache).
      # Analytics credentials and endpoints are deployment inputs. Requiring
      # them here prevents a production container from silently selecting a
      # predictable password or an unavailable in-memory telemetry path.
      TELEMETRY_MYSQL_DSN: "${TELEMETRY_MYSQL_DSN:?set the Analytics MySQL DSN}"
      TELEMETRY_REDIS_URL: "${TELEMETRY_REDIS_URL:?set the Analytics Redis URL}"
      TELEMETRY_AUTH_SECRET: "${TELEMETRY_AUTH_SECRET:?set the telemetry auth secret}"
      TELEMETRY_MAX_BODY_BYTES: ${TELEMETRY_MAX_BODY_BYTES:-1048576}
      TELEMETRY_MAX_BATCH_SIZE: ${TELEMETRY_MAX_BATCH_SIZE:-100}
      TELEMETRY_MAX_CONCURRENT_WRITERS: ${TELEMETRY_MAX_CONCURRENT_WRITERS:-4}
      TELEMETRY_RATE_LIMIT_CAPACITY: ${TELEMETRY_RATE_LIMIT_CAPACITY:-10}
      TELEMETRY_RATE_LIMIT_REFILL_PER_SECOND: ${TELEMETRY_RATE_LIMIT_REFILL_PER_SECOND:-1}
      TELEMETRY_RATE_LIMIT_MAX_DEVICES: ${TELEMETRY_RATE_LIMIT_MAX_DEVICES:-4096}
      TELEMETRY_RATE_LIMIT_DEVICE_TTL: ${TELEMETRY_RATE_LIMIT_DEVICE_TTL:-10m}
      TELEMETRY_RETRY_AFTER_SECONDS: ${TELEMETRY_RETRY_AFTER_SECONDS:-1}
    networks:
      - relay_internal
      - analytics_state

  # Analytics MySQL storage for the telemetry ingest (admin-api backend).
  # Isolated on analytics_state: admin-api is its only consumer.
  analytics-mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    profiles: ["storage"]
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_DATABASE: telemetry
      MYSQL_USER: telemetry
      MYSQL_PASSWORD: "${ANALYTICS_MYSQL_PASSWORD:?set the Analytics MySQL password}"
      MYSQL_ROOT_PASSWORD: "${ANALYTICS_MYSQL_ROOT_PASSWORD:?set the Analytics MySQL root password}"
      TZ: UTC
    volumes:
      - analytics_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping -h 127.0.0.1 -utelemetry
          -p"$${MYSQL_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      - analytics_state

  # Analytics Redis hot cache for recent telemetry diagnostics (admin-api backend).
  # Resource-capped (64mb, noeviction) and isolated on analytics_state.
  analytics-redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    profiles: ["storage"]
    restart: unless-stopped
    expose:
      - "6379"
    environment:
      ANALYTICS_REDIS_PASSWORD: "${ANALYTICS_REDIS_PASSWORD:?set the Analytics Redis password}"
    command:
      - sh
      - -ec
      - >-
        if [ "$${#ANALYTICS_REDIS_PASSWORD}" -lt 16 ]; then
          echo "ANALYTICS_REDIS_PASSWORD must contain at least 16 characters" >&2;
          exit 1;
        fi;
        exec redis-server --maxmemory 64mb --maxmemory-policy noeviction
        --requirepass "$$ANALYTICS_REDIS_PASSWORD"
    volumes:
      - analytics_redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli --no-auth-warning -a "$${ANALYTICS_REDIS_PASSWORD}"
          ping | grep -q '^PONG$'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    networks:
      - analytics_state

  # MySQL storage for durable enrollment/revocation. This service is always
  # available to the Relay stack; set RELAY_STORAGE_MODE=memory only for a
  # local process-memory test while retaining the same Compose topology.
  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set the Relay MySQL root password}"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-relay}
      MYSQL_USER: ${MYSQL_USER:-relay}
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set the Relay MySQL password}"
      TZ: UTC
    volumes:
      - relay_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}"
          -p"$${MYSQL_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      - relay_state

  # Redis state layer (shared presence, nonce, events). This service is always
  # available to the Relay stack and keeps its bounded state on a named volume.
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: "${RELAY_REDIS_PASSWORD:?set the Relay Redis password}"
    command:
      - sh
      - -ec
      - >-
        if [ "$${#REDIS_PASSWORD}" -lt 16 ]; then
          echo "RELAY_REDIS_PASSWORD must contain at least 16 characters" >&2;
          exit 1;
        fi;
        exec redis-server --maxmemory 128mb --maxmemory-policy noeviction
        --requirepass "$$REDIS_PASSWORD"
    volumes:
      - relay_redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}"
          ping | grep -q '^PONG$'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    networks:
      - relay_state

  front:
    build:
      context: ./front
      args:
        FRONT_INTERNAL_PORT: ${FRONT_INTERNAL_PORT:-80}
    restart: unless-stopped
    expose:
      - "${FRONT_INTERNAL_PORT:-80}"
    environment:
      FRONT_INTERNAL_PORT: ${FRONT_INTERNAL_PORT:-80}
    networks:
      - relay_internal

  caddy:
    image: ${RELAY_CADDY_IMAGE:-caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648}
    restart: unless-stopped
    depends_on:
      - relay
      - admin-api
      - front
    ports:
      - "${RELAY_HTTP_PORT:-80}:${CADDY_HTTP_PORT:-80}"
      - "${RELAY_HTTPS_PORT:-443}:${CADDY_HTTPS_PORT:-443}"
    environment:
      RELAY_PUBLIC_DOMAIN: ${RELAY_PUBLIC_DOMAIN:-localhost}
      RELAY_INTERNAL_PORT: ${RELAY_INTERNAL_PORT:-8080}
      ADMIN_INTERNAL_PORT: ${ADMIN_INTERNAL_PORT:-8081}
      FRONT_INTERNAL_PORT: ${FRONT_INTERNAL_PORT:-80}
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:-80}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      relay_internal:
        ipv4_address: ${RELAY_CADDY_IP:-172.30.0.10}

networks:
  relay_internal:
    ipam:
      config:
        - subnet: ${RELAY_NETWORK_SUBNET:-172.30.0.0/24}
  relay_state:
    internal: true
  analytics_state:
    internal: true

volumes:
  relay_mysql_data:
  relay_redis_data:
  analytics_mysql_data:
  analytics_redis_data:
  caddy_data:
  caddy_config:
