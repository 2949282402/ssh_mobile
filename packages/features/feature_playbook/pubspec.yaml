name: feature_playbook
description: Reusable playbook orchestration feature for SSH Mobile.
publish_to: 'none'

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

resolution: workspace

dependencies:
  app_core:
    path: ../../core/app_core
  app_ui:
    path: ../../core/app_ui
  connection_core:
    path: ../../core/connection_core
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  ssh_core:
    path: ../../infrastructure/ssh_core

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
