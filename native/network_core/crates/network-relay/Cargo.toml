[package]
name = "network-relay"
version = "0.1.0"
edition = "2021"

[[test]]
name = "relay_control_client_integration"
path = "tests/relay_control_client_integration.rs"
required-features = ["test-support"]

[[test]]
name = "client_backend_e2e"
path = "tests/client_backend_e2e.rs"
required-features = ["test-support"]

[[test]]
name = "telemetry_e2e"
path = "tests/telemetry_e2e.rs"
required-features = ["test-support"]

[features]
test-support = []

[dependencies]
network-protocol = { path = "../network-protocol" }
prost = "0.13"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
thiserror = "1.0"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures-util = "0.3"
serde_json = "1.0"
base64 = "0.22"
ed25519-dalek = "2.1"
rand = "0.8"
url = "2.5"
hex = "0.4"

[dev-dependencies]
hmac = "0.12"
sha2 = "0.10"
tokio = { version = "1.38", features = ["test-util"] }
