[package]
name = "network-relay"
version = "0.1.0"
edition = "2021"

[features]
test-support = []

[dependencies]
network-protocol = { path = "../network-protocol" }
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
thiserror = "1.0"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde_json = "1.0"
base64 = "0.22"
ed25519-dalek = "2.1"
rand = "0.8"
url = "2.5"
hex = "0.4"
