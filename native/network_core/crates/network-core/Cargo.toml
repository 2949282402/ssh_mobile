[package]
name = "network-core"
version = "0.1.0"
edition = "2021"

[dependencies]
network-protocol = { path = "../network-protocol" }
network-identity = { path = "../network-identity" }
network-nat = { path = "../network-nat" }
network-quic = { path = "../network-quic" }
network-transfer = { path = "../network-transfer" }
network-relay = { path = "../network-relay" }
quinn = "0.11"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
thiserror = "1.0"
aes-gcm = "0.10"
hkdf = "0.12"
base64 = "0.22"
rand = "0.8"
serde_json = "1.0"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
rand = "0.8"
