[package]
name = "network-quic"
version = "0.1.0"
edition = "2021"

[dependencies]
network-core = { path = "../network-core" }
network-protocol = { path = "../network-protocol" }
network-identity = { path = "../network-identity" }
network-nat = { path = "../network-nat" }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
rand = "0.8"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
thiserror = "1.0"
