[package]
name = "network-transport"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = "0.3"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
url = "2.5"

# Deterministic write-pressure test seam used only by `network-core` tests and
# this crate's own `testkit`-gated tests. Never enabled in production builds.
[features]
testkit = []
