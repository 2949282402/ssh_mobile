name: Flutter

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'
  NODE_VERSION: '24.19.0'
  GO_VERSION: '1.27.0'
  PROTOC_VERSION: '35.1'
  BUF_VERSION: '1.72.0'
  RUST_TOOLCHAIN: '1.97.1'

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install front dependencies
        run: npm ci
      - name: Typecheck front
        run: npm run typecheck
      - name: Lint front
        run: npm run lint
      - name: Test front
        run: npm run test:run
      - name: Build front
        run: npm run build
      - name: Build front container
        run: docker build -t ssh-mobile-relay-front:test .

  native-network-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/network_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "native/network_core -> target"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Start local coturn
        run: >-
          docker run -d --rm --name ssh-mobile-coturn --network host
          coturn/coturn:4.6.3 -n --log-file=stdout --lt-cred-mech
          --fingerprint --user test:test --realm=ssh-mobile.test
          --no-tls --no-dtls --min-port=49160 --max-port=49200
          --no-multicast-peers
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Test WebRTC TURN fallback
        run: >-
          cargo test -p network-webrtc --locked --
          --ignored relay_only_drivers_exchange_data_channel_payloads
      - name: Stop local coturn
        if: always()
        run: docker rm -f ssh-mobile-coturn || true
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  sdk-dart-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Install native Dart package dependencies
        working-directory: packages/infrastructure/ssh_mobile_network_native
        run: flutter pub get
      - name: Format SDK packages
        run: >-
          dart run melos run format
          --scope=network_sdk
          --scope=network_transport
          --scope=ssh_mobile_network_native
      - name: Analyze SDK packages
        run: >-
          dart run melos run analyze
          --scope=network_sdk
          --scope=network_transport
          --scope=ssh_mobile_network_native
      - name: Test SDK packages
        run: >-
          dart run melos run test
          --scope=network_sdk
          --scope=network_transport
          --scope=ssh_mobile_network_native

  relay-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: relay
    env:
      # Without these the MySQL/Redis integration tests and the multi-instance
      # tests silently t.Skip; the services below make them actually run.
      # go-sql-driver handles MySQL 8's default caching_sha2_password auth (RSA
      # exchange) automatically, so the DSN needs no extra auth parameter.
      RELAY_TEST_MYSQL_DSN: "relay:relay@tcp(127.0.0.1:3306)/relay?parseTime=true&loc=UTC"
      RELAY_TEST_REDIS_URL: "redis://127.0.0.1:6379/0"
    services:
      # Mirrors relay/compose.yaml storage profile (mysql:8.4, redis:7-alpine).
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: relay
          MYSQL_USER: relay
          MYSQL_PASSWORD: relay
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -urelay -prelay"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: relay/go.sum
      - name: Check Go formatting
        run: |
          go fmt ./...
          git diff --exit-code -- .
      - name: Test relay
        run: go test ./...
      - name: Test relay with race detector
        run: go test -race ./...
      - name: Vet relay
        run: go vet ./...
      - name: Scan relay vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  protocol-v2-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "native/network_core -> target"
      - uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
      - name: Compile-check all Network V2 protos
        run: |
          protoc --proto_path=protocol \
            --descriptor_set_out=/tmp/network-v2.desc \
            protocol/proto/relay/v2/relay_v2.proto \
            protocol/proto/network/v2/network.proto
      - name: Run relay v2 contract check
        run: bash scripts/relay_v2_contract.sh
      - name: Run strict network v2 acceptance gate
        run: bash scripts/network_v2_acceptance.sh strict
      - name: buf lint
        working-directory: protocol
        run: buf lint
      - name: buf breaking against frozen Relay V2
        working-directory: protocol
        run: >-
          buf breaking .
          --against '../.git#ref=6ec194bb3a66a748215d3abc11d6da84bd329619,subdir=protocol'
          --path proto/relay/v2/relay_v2.proto

  architecture-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Check agent documentation
        run: dart run tool/check_agent_docs.dart
      - name: Test agent documentation checker
        run: dart run test/tool/agent_docs_check_test.dart
      - name: Test CI workflow contract
        run: dart run test/tool/ci_workflow_test.dart
      - name: Check architecture guard
        run: dart run tool/architecture_check.dart
      - name: Check module dependencies
        run: dart run tool/check_module_dependencies.dart
      - name: Check resource owners
        run: dart run tool/check_resource_owners.dart
      - name: Check compatibility import inventory
        run: dart run tool/compatibility_check.dart
      - name: Check duplicate implementations
        run: dart run tool/duplicate_implementation_check.dart

  workspace-core-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Format core packages
        run: >-
          dart run melos run format
          --scope=app_core
          --scope=app_ui
          --scope=connection_core
          --scope=ssh_core
      - name: Analyze core packages
        run: >-
          dart run melos run analyze
          --scope=app_core
          --scope=app_ui
          --scope=connection_core
          --scope=ssh_core
      - name: Test core packages
        run: >-
          dart run melos run test
          --scope=app_core
          --scope=app_ui
          --scope=connection_core
          --scope=ssh_core

  workspace-features-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Format feature packages
        run: >-
          dart run melos run format
          --scope=feature_ai
          --scope=feature_connection
          --scope=feature_developer
          --scope=feature_lan_share
          --scope=feature_mcp
          --scope=feature_monitoring
          --scope=feature_playbook
          --scope=feature_rag
          --scope=feature_sftp
          --scope=feature_system_admin
          --scope=feature_terminal
          --scope=feature_webview
      - name: Analyze feature packages
        run: >-
          dart run melos run analyze
          --scope=feature_ai
          --scope=feature_connection
          --scope=feature_developer
          --scope=feature_lan_share
          --scope=feature_mcp
          --scope=feature_monitoring
          --scope=feature_playbook
          --scope=feature_rag
          --scope=feature_sftp
          --scope=feature_system_admin
          --scope=feature_terminal
          --scope=feature_webview
      - name: Test feature packages
        run: >-
          dart run melos run test
          --scope=feature_ai
          --scope=feature_connection
          --scope=feature_developer
          --scope=feature_lan_share
          --scope=feature_mcp
          --scope=feature_monitoring
          --scope=feature_playbook
          --scope=feature_rag
          --scope=feature_sftp
          --scope=feature_system_admin
          --scope=feature_terminal
          --scope=feature_webview

  terminal-smoke-build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Install Terminal app dependencies
        working-directory: apps/ssh_mobile_terminal
        run: flutter pub get
      - name: Build Terminal-only smoke app
        working-directory: apps/ssh_mobile_terminal
        run: flutter build windows --debug --no-pub

  app-static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        working-directory: .
        run: dart pub get
      - name: Install native Dart package dependencies
        working-directory: packages/infrastructure/ssh_mobile_network_native
        run: flutter pub get
      - name: Install Full App dependencies
        run: flutter pub get
      - name: Check generated app icons
        run: |
          dart run tool/generate_app_icons.dart
          git diff --exit-code -- assets android ios macos web windows/runner/resources/app_icon.ico
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Check generated database code
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/data/database/app_database.g.dart
      - name: Security regression grep
        run: |
          if grep -R "SshIdentityCache" lib; then exit 1; fi
          if grep -R "reconnectCredentials" lib; then exit 1; fi
          if grep -R "privateKeyDigest" lib; then exit 1; fi
      - name: Analyze
        run: flutter analyze --no-fatal-infos

  app-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1]
        total_shards: [2]
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        working-directory: .
        run: dart pub get
      - name: Install native Dart package dependencies
        working-directory: packages/infrastructure/ssh_mobile_network_native
        run: flutter pub get
      - name: Install Full App dependencies
        run: flutter pub get
      - name: Run Sharded Unit Tests
        run: |
          isolated_coverage_test_files=(
            test/features/startup/views/startup_screen_test.dart
            test/screens/system_admin/system_admin_snapshot_tabs_test.dart
          )
          non_coverage_test_files=(
            test/services/network/transfer_transport_test.dart
          )
          coverage_test_files=()
          mapfile -d '' all_test_files < <(
            find test -type f -name '*_test.dart' -print0 | sort -z
          )
          for test_file in "${all_test_files[@]}"; do
            case "$test_file" in
              test/features/startup/views/startup_screen_test.dart|test/screens/system_admin/system_admin_snapshot_tabs_test.dart|test/services/network/transfer_transport_test.dart)
                ;;
              *)
                coverage_test_files+=("$test_file")
                ;;
            esac
          done

          if [ "${#coverage_test_files[@]}" -eq 0 ]; then
            echo "No coverage test files were discovered."
            exit 1
          fi

          for attempt in 1 2; do
            echo "Running Flutter test shard ${{ matrix.shard_index }} (attempt $attempt)."
            rm -f coverage/lcov.info
            if timeout --signal=TERM --kill-after=30s 8m \
              flutter test --coverage --reporter expanded \
              --fail-fast \
              --timeout 60s \
              --total-shards "${{ matrix.total_shards }}" \
              --shard-index "${{ matrix.shard_index }}" \
              "${coverage_test_files[@]}"; then
              break
            else
              status=$?
            fi

            if [ "$attempt" -eq 2 ]; then
              exit "$status"
            fi
            echo "Flutter test shard failed or timed out; retrying once."
          done

          echo "Running isolated Flutter tests with supplemental coverage."
          rm -f coverage/isolated-startup-lcov.info
          timeout --signal=TERM --kill-after=30s 8m \
            flutter test \
            --coverage \
            --coverage-path coverage/isolated-startup-lcov.info \
            --fail-fast \
            --reporter expanded \
            --timeout 60s \
            --total-shards "${{ matrix.total_shards }}" \
            --shard-index "${{ matrix.shard_index }}" \
            "${isolated_coverage_test_files[0]}"

          rm -f coverage/isolated-system-admin-lcov.info
          timeout --signal=TERM --kill-after=30s 8m \
            flutter test \
            --coverage \
            --coverage-path coverage/isolated-system-admin-lcov.info \
            --fail-fast \
            --reporter expanded \
            --timeout 60s \
            --total-shards "${{ matrix.total_shards }}" \
            --shard-index "${{ matrix.shard_index }}" \
            "${isolated_coverage_test_files[1]}"

          echo "Running native Flutter tests without coverage."
          timeout --signal=TERM --kill-after=30s 8m \
            flutter test \
            --fail-fast \
            --reporter expanded \
            --timeout 60s \
            --total-shards "${{ matrix.total_shards }}" \
            --shard-index "${{ matrix.shard_index }}" \
            "${non_coverage_test_files[@]}"
      - name: Upload shard coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-${{ matrix.shard_index }}
          path: apps/ssh_mobile_full/coverage/*.info
          if-no-files-found: error

  app-coverage:
    runs-on: ubuntu-latest
    needs: app-unit-tests
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Full App dependencies
        run: flutter pub get
      - name: Download shard coverage
        uses: actions/download-artifact@v4
        with:
          pattern: flutter-coverage-*
          path: coverage-shards
      - name: Enforce shard coverage
        run: |
          mapfile -d '' shard_files < <(find "$GITHUB_WORKSPACE/coverage-shards" -type f -name lcov.info -print0 | sort -z)
          if [ "${#shard_files[@]}" -ne 2 ]; then
            echo "Expected 2 shard coverage files, found ${#shard_files[@]}."
            exit 1
          fi

          mapfile -d '' isolated_files < <(find "$GITHUB_WORKSPACE/coverage-shards" -type f -name 'isolated-*.info' -print0 | sort -z)
          if [ "${#isolated_files[@]}" -ne 4 ]; then
            echo "Expected 4 isolated coverage files, found ${#isolated_files[@]}."
            exit 1
          fi

          coverage_args=()
          for shard_file in "${shard_files[@]}"; do
            coverage_args+=("--file=$shard_file")
          done
          for isolated_file in "${isolated_files[@]}"; do
            coverage_args+=("--file=$isolated_file")
          done

          dart run tool/check_coverage.dart \
            --minimum=35 \
            "${coverage_args[@]}"

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        working-directory: .
        run: dart pub get
      - name: Install native Dart package dependencies
        working-directory: packages/infrastructure/ssh_mobile_network_native
        run: flutter pub get
      - name: Install Full App dependencies
        run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        working-directory: .
        run: dart pub get
      - name: Install Full App dependencies
        working-directory: apps/ssh_mobile_full
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows

  macos-build:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - name: Install dependencies
        working-directory: .
        run: dart pub get
      - name: Install Full App dependencies
        working-directory: apps/ssh_mobile_full
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos

  ios-build:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        working-directory: .
        run: dart pub get
      - name: Install Full App dependencies
        run: flutter pub get
      - name: Update CocoaPods specs
        working-directory: apps/ssh_mobile_full/ios
        run: pod repo update
      - name: Register share_handler iOS models for CI
        working-directory: apps/ssh_mobile_full/ios
        run: |
          ruby <<'RUBY'
          path = 'Podfile'
          text = File.read(path)
          marker = "  flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))\n"
          addition = "#{marker}  pod 'share_handler_ios_models', :path => '.symlinks/plugins/share_handler_ios/ios/Models'\n"
          abort 'Runner Podfile marker was not found' unless text.include?(marker)
          abort 'share_handler_ios_models is already registered' if text.include?("pod 'share_handler_ios_models'")
          File.write(path, text.sub(marker, addition))
          RUBY
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign --no-pub
