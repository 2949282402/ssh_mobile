name: Flutter

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-network-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/network_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  relay-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: relay/go.sum
      - name: Check Go formatting
        run: |
          go fmt ./...
          git diff --exit-code -- .
      - name: Test relay
        run: go test ./...

  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Install native Dart package dependencies
        working-directory: packages/ssh_mobile_network_native
        run: dart pub get
      - name: Analyze native Dart package
        working-directory: packages/ssh_mobile_network_native
        run: dart analyze
      - name: Test native Dart package
        working-directory: packages/ssh_mobile_network_native
        run: dart test
      - name: Check generated app icons
        run: |
          dart run tool/generate_app_icons.dart
          git diff --exit-code -- assets android ios macos web windows/runner/resources/app_icon.ico
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Check generated database code
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/data/database/app_database.g.dart
      - name: Check shared agent skills
        shell: pwsh
        run: ./scripts/sync_agent_skills.ps1 -Mode Check
      - name: Security regression grep
        run: |
          if grep -R "SshIdentityCache" lib; then exit 1; fi
          if grep -R "reconnectCredentials" lib; then exit 1; fi
          if grep -R "privateKeyDigest" lib; then exit 1; fi
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage --reporter expanded
      - name: Check coverage floor
        run: dart run tool/check_coverage.dart --minimum=35
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Test
        run: flutter test --reporter expanded
      - name: Build Windows
        run: flutter build windows

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Test
        run: flutter test --reporter expanded
      - name: Build macOS
        run: flutter build macos
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign --no-pub
