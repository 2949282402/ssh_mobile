name: Flutter

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install front dependencies
        run: npm ci
      - name: Typecheck front
        run: npm run typecheck
      - name: Lint front
        run: npm run lint
      - name: Test front
        run: npm run test:run
      - name: Build front
        run: npm run build
      - name: Build front container
        run: docker build -t ssh-mobile-relay-front:test .

  native-network-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/network_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Start local coturn
        run: >-
          docker run -d --rm --name ssh-mobile-coturn --network host
          coturn/coturn:4.6.3 -n --log-file=stdout --lt-cred-mech
          --fingerprint --user test:test --realm=ssh-mobile.test
          --no-tls --no-dtls --min-port=49160 --max-port=49200
          --no-multicast-peers
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Test WebRTC TURN fallback
        run: >-
          cargo test -p network-webrtc --locked --
          --ignored relay_only_drivers_exchange_data_channel_payloads
      - name: Stop local coturn
        if: always()
        run: docker rm -f ssh-mobile-coturn || true
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  sdk-dart-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Install native Dart package dependencies
        working-directory: packages/infrastructure/ssh_mobile_network_native
        run: flutter pub get
      - name: Format SDK packages
        run: >-
          dart run melos run format
          --scope=network_sdk
          --scope=network_transport
          --scope=ssh_mobile_network_native
      - name: Analyze SDK packages
        run: >-
          dart run melos run analyze
          --scope=network_sdk
          --scope=network_transport
          --scope=ssh_mobile_network_native
      - name: Test SDK packages
        run: >-
          dart run melos run test
          --scope=network_sdk
          --scope=network_transport
          --scope=ssh_mobile_network_native

  relay-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    env:
      # Without these the MySQL/Redis integration tests and the multi-instance
      # tests silently t.Skip; the services below make them actually run.
      # go-sql-driver handles MySQL 8's default caching_sha2_password auth (RSA
      # exchange) automatically, so the DSN needs no extra auth parameter.
      RELAY_TEST_MYSQL_DSN: "relay:relay@tcp(127.0.0.1:3306)/relay?parseTime=true&loc=UTC"
      RELAY_TEST_REDIS_URL: "redis://127.0.0.1:6379/0"
    services:
      # Mirrors relay/compose.yaml storage profile (mysql:8.4, redis:7-alpine).
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: relay
          MYSQL_USER: relay
          MYSQL_PASSWORD: relay
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -urelay -prelay"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: relay/go.sum
      - name: Check Go formatting
        run: |
          go fmt ./...
          git diff --exit-code -- .
      - name: Test relay
        run: go test ./...
      - name: Test relay with race detector
        run: go test -race ./...
      - name: Vet relay
        run: go vet ./...
      - name: Scan relay vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  architecture-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Check agent documentation
        run: dart run tool/check_agent_docs.dart
      - name: Test agent documentation checker
        run: dart run test/tool/agent_docs_check_test.dart
      - name: Check architecture guard
        run: dart run tool/architecture_check.dart
      - name: Check module dependencies
        run: dart run tool/check_module_dependencies.dart
      - name: Check resource owners
        run: dart run tool/check_resource_owners.dart
      - name: Check compatibility import inventory
        run: dart run tool/compatibility_check.dart
      - name: Check duplicate implementations
        run: dart run tool/duplicate_implementation_check.dart

  workspace-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Format workspace packages
        run: >-
          dart run melos run format
          --ignore=ssh_mobile
          --ignore=network_sdk
          --ignore=network_transport
          --ignore=ssh_mobile_network_native
      - name: Analyze workspace packages
        run: >-
          dart run melos run analyze
          --ignore=ssh_mobile
          --ignore=network_sdk
          --ignore=network_transport
          --ignore=ssh_mobile_network_native
      - name: Test workspace packages
        run: >-
          dart run melos run test
          --ignore=ssh_mobile
          --ignore=network_sdk
          --ignore=network_transport
          --ignore=ssh_mobile_network_native

  terminal-smoke-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Install Terminal app dependencies
        working-directory: apps/ssh_mobile_terminal
        run: flutter pub get
      - name: Build Terminal-only smoke app
        working-directory: apps/ssh_mobile_terminal
        run: flutter build windows --debug --no-pub

  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Install dependencies
        working-directory: .
        run: dart pub get
      - name: Install native Dart package dependencies
        working-directory: packages/infrastructure/ssh_mobile_network_native
        run: flutter pub get
      - name: Install Full App dependencies
        working-directory: apps/ssh_mobile_full
        run: flutter pub get
      - name: Check generated app icons
        run: |
          dart run tool/generate_app_icons.dart
          git diff --exit-code -- assets android ios macos web windows/runner/resources/app_icon.ico
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Check generated database code
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/data/database/app_database.g.dart
      - name: Security regression grep
        run: |
          if grep -R "SshIdentityCache" lib; then exit 1; fi
          if grep -R "reconnectCredentials" lib; then exit 1; fi
          if grep -R "privateKeyDigest" lib; then exit 1; fi
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test --coverage --reporter expanded
      - name: Check coverage floor
        run: dart run tool/check_coverage.dart --minimum=35

  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Install dependencies
        working-directory: .
        run: dart pub get
      - name: Install native Dart package dependencies
        working-directory: packages/infrastructure/ssh_mobile_network_native
        run: flutter pub get
      - name: Install Full App dependencies
        run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        working-directory: .
        run: dart pub get
      - name: Install Full App dependencies
        working-directory: apps/ssh_mobile_full
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows

  macos-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - name: Install dependencies
        working-directory: .
        run: dart pub get
      - name: Install Full App dependencies
        working-directory: apps/ssh_mobile_full
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos

  ios-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Install dependencies
        working-directory: .
        run: dart pub get
      - name: Install Full App dependencies
        run: flutter pub get
      - name: Update CocoaPods specs
        working-directory: apps/ssh_mobile_full/ios
        run: pod repo update
      - name: Register share_handler iOS models for CI
        working-directory: apps/ssh_mobile_full/ios
        run: |
          ruby <<'RUBY'
          path = 'Podfile'
          text = File.read(path)
          marker = "  flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))\n"
          addition = "#{marker}  pod 'share_handler_ios_models', :path => '.symlinks/plugins/share_handler_ios/ios/Models'\n"
          abort 'Runner Podfile marker was not found' unless text.include?(marker)
          abort 'share_handler_ios_models is already registered' if text.include?("pod 'share_handler_ios_models'")
          File.write(path, text.sub(marker, addition))
          RUBY
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign --no-pub
