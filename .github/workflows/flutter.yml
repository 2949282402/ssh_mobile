name: Flutter

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install front dependencies
        run: npm ci
      - name: Typecheck front
        run: npm run typecheck
      - name: Lint front
        run: npm run lint
      - name: Test front
        run: npm run test:run
      - name: Build front
        run: npm run build
      - name: Build front container
        run: docker build -t ssh-mobile-relay-front:test .

  native-network-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/network_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  relay-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: relay/go.sum
      - name: Check Go formatting
        run: |
          go fmt ./...
          git diff --exit-code -- .
      - name: Test relay
        run: go test ./...
      - name: Vet relay
        run: go vet ./...

  architecture-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Check architecture guard
        run: dart run tool/architecture_check.dart
      - name: Check compatibility import inventory
        run: dart run tool/compatibility_check.dart
      - name: Check duplicate implementations
        run: dart run tool/duplicate_implementation_check.dart

  package-quality:
    if: github.event_name == 'pull_request'
    needs: architecture-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Select pull request diff
        id: diff
        shell: bash
        run: |
          range="${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          echo "range=$range" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$range" | grep -Eq '^(apps|packages)/'; then
            echo "has_package_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package_changes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check changed package formatting
        if: steps.diff.outputs.has_package_changes == 'true'
        env:
          MELOS_DIFF: ${{ steps.diff.outputs.range }}
        run: >-
          dart run melos exec --diff="$MELOS_DIFF" --include-dependents --fail-fast --
          "dart format --output=none --set-exit-if-changed lib test"
      - name: Analyze changed packages
        if: steps.diff.outputs.has_package_changes == 'true'
        env:
          MELOS_DIFF: ${{ steps.diff.outputs.range }}
        run: >-
          dart run melos exec --diff="$MELOS_DIFF" --include-dependents --fail-fast --
          "flutter analyze --no-pub"
      - name: Test changed packages
        if: steps.diff.outputs.has_package_changes == 'true'
        env:
          MELOS_DIFF: ${{ steps.diff.outputs.range }}
        run: >-
          dart run melos exec --diff="$MELOS_DIFF" --include-dependents --fail-fast --
          "flutter test --no-pub"

  workspace-quality:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: architecture-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Format workspace packages
        run: dart run melos run format
      - name: Analyze workspace packages
        run: dart run melos run analyze
      - name: Test workspace packages
        run: dart run melos run test
      - name: Check full app format and tools
        working-directory: apps/ssh_mobile_full
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Build full app smoke APK
        working-directory: apps/ssh_mobile_full
        run: flutter build apk --debug --no-pub

  terminal-smoke-build:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: architecture-check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Install Terminal app dependencies
        working-directory: apps/ssh_mobile_terminal
        run: flutter pub get
      - name: Build Terminal-only smoke app
        working-directory: apps/ssh_mobile_terminal
        run: flutter build windows --debug --no-pub

  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Install dependencies
        working-directory: .
        run: dart pub get
      - name: Install native Dart package dependencies
        working-directory: packages/infrastructure/ssh_mobile_network_native
        run: flutter pub get
      - name: Analyze native Dart package
        working-directory: packages/infrastructure/ssh_mobile_network_native
        run: flutter analyze
      - name: Test native Dart package
        working-directory: packages/infrastructure/ssh_mobile_network_native
        run: flutter test
      - name: Check generated app icons
        run: |
          dart run tool/generate_app_icons.dart
          git diff --exit-code -- assets android ios macos web windows/runner/resources/app_icon.ico
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Check generated database code
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/data/database/app_database.g.dart
      - name: Check shared agent skills
        working-directory: .
        shell: pwsh
        run: ./scripts/sync_agent_skills.ps1 -Mode Check
      - name: Security regression grep
        run: |
          if grep -R "SshIdentityCache" lib; then exit 1; fi
          if grep -R "reconnectCredentials" lib; then exit 1; fi
          if grep -R "privateKeyDigest" lib; then exit 1; fi
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage --reporter expanded
      - name: Check coverage floor
        run: dart run tool/check_coverage.dart --minimum=35
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        working-directory: .
        run: dart pub get
      - name: Test
        run: flutter test --reporter expanded
      - name: Build Windows
        run: flutter build windows

  macos-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - name: Install dependencies
        working-directory: .
        run: dart pub get
      - name: Test
        run: flutter test --reporter expanded
      - name: Build macOS
        run: flutter build macos
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign --no-pub
