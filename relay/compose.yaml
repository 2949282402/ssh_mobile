services:
  relay:
    build:
      context: .
      args:
        RELAY_INTERNAL_PORT: ${RELAY_INTERNAL_PORT:?set relay internal port}
    restart: unless-stopped
    expose:
      - "${RELAY_INTERNAL_PORT:?set relay internal port}"
    environment:
      RELAY_ADDR: ":${RELAY_INTERNAL_PORT:?set relay internal port}"
      RELAY_ENROLLMENT_TOKEN: ${RELAY_ENROLLMENT_TOKEN:?set a one-time enrollment token}
      RELAY_CREDENTIAL_KEY: ${RELAY_CREDENTIAL_KEY:?set a base64url 32-byte signing key}
      RELAY_CREDENTIAL_TTL: ${RELAY_CREDENTIAL_TTL:?set credential ttl}
      RELAY_SESSION_TTL: ${RELAY_SESSION_TTL:?set session ttl}
      RELAY_MAX_CONNECTIONS: ${RELAY_MAX_CONNECTIONS:?set max connections}
      RELAY_ADMIN_USER: ${RELAY_ADMIN_USER:?set the dashboard administrator username}
      RELAY_ADMIN_PASSWORD: ${RELAY_ADMIN_PASSWORD:?set a dashboard password with at least 12 characters}
    networks:
      - relay_internal

  front:
    build:
      context: ../front
      args:
        FRONT_INTERNAL_PORT: ${FRONT_INTERNAL_PORT:?set front internal port}
    restart: unless-stopped
    expose:
      - "${FRONT_INTERNAL_PORT:?set front internal port}"
    environment:
      FRONT_INTERNAL_PORT: ${FRONT_INTERNAL_PORT:?set front internal port}
    networks:
      - relay_internal

  caddy:
    image: ${RELAY_CADDY_IMAGE:?set caddy image}
    restart: unless-stopped
    depends_on:
      - relay
      - front
    ports:
      - "${RELAY_HTTP_PORT:?set public http port}:${CADDY_HTTP_PORT:?set caddy http port}"
      - "${RELAY_HTTPS_PORT:?set public https port}:${CADDY_HTTPS_PORT:?set caddy https port}"
    environment:
      RELAY_PUBLIC_DOMAIN: ${RELAY_PUBLIC_DOMAIN:?set the public relay DNS name}
      RELAY_INTERNAL_PORT: ${RELAY_INTERNAL_PORT:?set relay internal port}
      FRONT_INTERNAL_PORT: ${FRONT_INTERNAL_PORT:?set front internal port}
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:?set caddy http port}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:?set caddy https port}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificate state only; the relay itself never gets a data volume.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - relay_internal

networks:
  relay_internal:

volumes:
  caddy_data:
  caddy_config:
