services:
  relay:
    build:
      context: .
      args:
        RELAY_INTERNAL_PORT: ${RELAY_INTERNAL_PORT:?set relay internal port}
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - "${RELAY_INTERNAL_PORT:?set relay internal port}"
    environment:
      RELAY_ADDR: ":${RELAY_INTERNAL_PORT:?set relay internal port}"
      RELAY_ENROLLMENT_TOKEN: ${RELAY_ENROLLMENT_TOKEN:?set a one-time enrollment token}
      RELAY_CREDENTIAL_KEY: ${RELAY_CREDENTIAL_KEY:?set a base64url 32-byte signing key}
      RELAY_CREDENTIAL_TTL: ${RELAY_CREDENTIAL_TTL:?set credential ttl}
      RELAY_ADMIN_SESSION_TTL: ${RELAY_ADMIN_SESSION_TTL:?set admin session ttl}
      RELAY_MAX_CONNECTIONS: ${RELAY_MAX_CONNECTIONS:?set max connections}
      RELAY_MAX_ENROLLED_DEVICES: ${RELAY_MAX_ENROLLED_DEVICES:?set max enrolled devices}
      RELAY_MAX_REVOKED_DEVICES: ${RELAY_MAX_REVOKED_DEVICES:?set max revoked device tombstones}
      RELAY_MAX_TRANSFER_SESSIONS: ${RELAY_MAX_TRANSFER_SESSIONS:?set max transfer sessions}
      RELAY_MAX_PENDING_FRAMES_PER_DEVICE: ${RELAY_MAX_PENDING_FRAMES_PER_DEVICE:?set max pending frames per device}
      RELAY_MAX_PENDING_BYTES_PER_DEVICE: ${RELAY_MAX_PENDING_BYTES_PER_DEVICE:?set max pending bytes per device}
      RELAY_MAX_FRAMES_PER_SECOND_PER_DEVICE: ${RELAY_MAX_FRAMES_PER_SECOND_PER_DEVICE:?set max frames per second per device}
      RELAY_MAX_BYTES_PER_SECOND_PER_DEVICE: ${RELAY_MAX_BYTES_PER_SECOND_PER_DEVICE:?set max bytes per second per device}
      RELAY_MAX_ADMIN_SESSIONS: ${RELAY_MAX_ADMIN_SESSIONS:?set max administrator sessions}
      RELAY_ADMIN_LOGIN_MAX_ATTEMPTS: ${RELAY_ADMIN_LOGIN_MAX_ATTEMPTS:?set administrator login attempts}
      RELAY_ADMIN_LOGIN_WINDOW: ${RELAY_ADMIN_LOGIN_WINDOW:?set administrator login window}
      RELAY_ADMIN_LOGIN_BLOCK: ${RELAY_ADMIN_LOGIN_BLOCK:?set administrator login block duration}
      RELAY_MAX_ADMIN_LOGIN_ENTRIES: ${RELAY_MAX_ADMIN_LOGIN_ENTRIES:?set max administrator login keys}
      RELAY_HTTP_READ_TIMEOUT: ${RELAY_HTTP_READ_TIMEOUT:?set HTTP read timeout}
      RELAY_HTTP_WRITE_TIMEOUT: ${RELAY_HTTP_WRITE_TIMEOUT:?set HTTP write timeout}
      RELAY_HTTP_IDLE_TIMEOUT: ${RELAY_HTTP_IDLE_TIMEOUT:?set HTTP idle timeout}
      RELAY_HTTP_MAX_HEADER_BYTES: ${RELAY_HTTP_MAX_HEADER_BYTES:?set HTTP max header bytes}
      RELAY_TRUSTED_PROXY_CIDRS: ${RELAY_TRUSTED_PROXY_CIDRS:-}
      # The reservation endpoint is advertised to devices and must be the
      # externally reachable Caddy origin, never the internal Relay socket.
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:?set the externally reachable Relay origin}
      RELAY_ADMIN_USER: ${RELAY_ADMIN_USER:?set the dashboard administrator username}
      RELAY_ADMIN_PASSWORD: ${RELAY_ADMIN_PASSWORD:?set a dashboard password with at least 12 characters}
      # Storage backend: "memory" (default) or "mysql". mysql requires the
      # "storage" compose profile and RELAY_DATABASE_URL with parseTime=true.
      # RELAY_REDIS_URL (also under the storage profile) activates the shared
      # presence/nonce/admin-session/event layer.
      RELAY_STORAGE_MODE: ${RELAY_STORAGE_MODE:-memory}
      RELAY_DATABASE_URL: ${RELAY_DATABASE_URL:-}
      RELAY_REDIS_URL: ${RELAY_REDIS_URL:-}
      RELAY_REDIS_PASSWORD: ${RELAY_REDIS_PASSWORD:-}
      RELAY_INSTANCE_ID: ${RELAY_INSTANCE_ID:-}
      RELAY_PRESENCE_TTL: ${RELAY_PRESENCE_TTL:-60s}
    networks:
      - relay_internal
      - relay_state

  # MySQL storage for durable enrollment/revocation (RELAY_STORAGE_MODE=mysql).
  # Start with: docker compose --profile storage up -d
  mysql:
    image: mysql:8.4
    profiles: ["storage"]
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      # Default empty keeps memory-mode `docker compose up` valid; the mysql
      # image fails loudly at startup if no root password is provided.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-relay}
      MYSQL_USER: ${MYSQL_USER:-relay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      TZ: UTC
    volumes:
      - relay_mysql_data:/var/lib/mysql
    networks:
      - relay_state

  # Redis state layer (shared presence, nonce, admin sessions, events).
  redis:
    image: redis:7-alpine
    profiles: ["storage"]
    restart: unless-stopped
    expose:
      - "6379"
    environment:
      # Keep memory-only Compose interpolation valid while the storage profile
      # is inactive. The command below rejects a missing/short password before
      # Redis starts whenever this service is actually enabled.
      REDIS_PASSWORD: ${RELAY_REDIS_PASSWORD:-}
    # Security state must never be silently evicted: when bounded memory is
    # exhausted Redis rejects writes and Relay fails closed. The password is
    # expanded inside the container rather than embedded in the image or URL.
    command:
      - sh
      - -ec
      - >-
        if [ "$${#REDIS_PASSWORD}" -lt 16 ]; then
          echo "RELAY_REDIS_PASSWORD must contain at least 16 characters" >&2;
          exit 1;
        fi;
        exec redis-server --maxmemory 128mb --maxmemory-policy noeviction
        --requirepass "$$REDIS_PASSWORD"
    volumes:
      - relay_redis_data:/data
    networks:
      - relay_state

  front:
    build:
      context: ../front
      args:
        FRONT_INTERNAL_PORT: ${FRONT_INTERNAL_PORT:?set front internal port}
    restart: unless-stopped
    expose:
      - "${FRONT_INTERNAL_PORT:?set front internal port}"
    environment:
      FRONT_INTERNAL_PORT: ${FRONT_INTERNAL_PORT:?set front internal port}
    networks:
      - relay_internal

  caddy:
    image: ${RELAY_CADDY_IMAGE:?set caddy image}
    restart: unless-stopped
    depends_on:
      - relay
      - front
    ports:
      - "${RELAY_HTTP_PORT:?set public http port}:${CADDY_HTTP_PORT:?set caddy http port}"
      - "${RELAY_HTTPS_PORT:?set public https port}:${CADDY_HTTPS_PORT:?set caddy https port}"
    environment:
      RELAY_PUBLIC_DOMAIN: ${RELAY_PUBLIC_DOMAIN:?set the public relay DNS name}
      RELAY_INTERNAL_PORT: ${RELAY_INTERNAL_PORT:?set relay internal port}
      FRONT_INTERNAL_PORT: ${FRONT_INTERNAL_PORT:?set front internal port}
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:?set caddy http port}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:?set caddy https port}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificate state only; the relay itself never gets a data volume.
      - caddy_data:/data
      - caddy_config:/config
    # A static address on the internal network lets the relay trust this exact
    # boundary via RELAY_TRUSTED_PROXY_CIDRS and honor Caddy's forwarded
    # headers for per-client rate limiting.
    networks:
      relay_internal:
        ipv4_address: ${RELAY_CADDY_IP:-172.30.0.10}

networks:
  relay_internal:
    ipam:
      config:
        - subnet: ${RELAY_NETWORK_SUBNET:-172.30.0.0/24}
  relay_state:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  relay_mysql_data:
  relay_redis_data:
